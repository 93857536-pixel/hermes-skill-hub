# Windows 单文件安装器 EXE 自动构建 (GitHub Actions) — MediaConverter 实战模板

来源: MediaConverter 2026-08 实战。本机(macOS)无 dotnet/Windows,用户要求
Release **只交付 exe + dmg(不要 zip)** → 用 GitHub Actions 的 windows-latest
runner 远程编译自包含 EXE + Inno Setup 打成单文件安装器,自动上传到 Release。
触发即用,改 `tag` 输入即可。

⚠️ 为什么是"安装器 exe"而不是"裸 exe": WinUI 3 自包含发布的产物是几十个
文件(MediaConverter.exe + MediaConverter.dll + WindowsAppSDK 运行时 dll +
bin/ffmpeg.exe + bin/ffprobe.exe),**官方不支持 .NET 单文件发布
(PublishSingleFile)**——单传一个 exe 用户下载后跑不起来。必须用 Inno Setup
把整个 publish 目录打成单个安装器,双击安装即用(体验等同 dmg 拖拽安装)。
配套安装器脚本见 `templates/installer.iss`。

## 前置条件

- csproj 必须是 unpackaged 自包含模式(否则产 MSIX 不是裸 exe):
  - `<WindowsPackageType>None</WindowsPackageType>`
  - `<WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>`
  - `<Platforms>x64</Platforms>`
- **必须显式声明 WinUI 包引用**(最常见首次失败原因;`UseWinUI>true` 本身不够,
  缺失时报 CS0246 IValueConverter / CS0234 Microsoft.UI.Dispatching 等引用错误):
  ```xml
  <ItemGroup>
    <PackageReference Include="Microsoft.WindowsAppSDK" Version="1.8.260710003" />
    <PackageReference Include="Microsoft.Windows.SDK.BuildTools" Version="10.0.26100.7705" />
  </ItemGroup>
  ```
  版本先校验存在: `curl https://api.nuget.org/v3-flatcontainer/<包名小写>/index.json`。
- 仓库已启用 Actions(默认);gh CLI 已认证(本机需代理
  `export HTTPS_PROXY=http://127.0.0.1:1082`)。
- 触发: `gh workflow run windows-build.yml --ref main -f tag=v1.0.0`(push 到
  main 且改动 Windows/** 或 workflow 文件时也会自动触发)。

## 关键步骤(与踩坑)

1. `actions/checkout@v4` + `actions/setup-dotnet@v4`(8.0.x)
   + **`microsoft/setup-msbuild@v2`(vs-version: '17.8')** —— 见第 2 条
2. **publish 必须用 VS 的裸 `msbuild /t:Publish`,不能用 `dotnet publish` 或
   `dotnet msbuild`**:
   - `dotnet publish`/`dotnet msbuild` 都缺 XAML MarkupCompilePass2 的
     LocalAssembly 传递 → `WMC1509: No LocalAssembly` + 本项目类型全部解析失败
     (`WMC0001: Unknown type` / `WMC0909: Cannot resolve DataType`)。
   - windows-latest runner 的 PATH 里没有 msbuild.exe → 先
     `microsoft/setup-msbuild@v2` 把 VS 的 msbuild.exe 加进 PATH,再用裸 `msbuild`。
   - **`/p:Platform=x64` 必须传**: 否则输出路径不含 x64,publish 目录定位失败;
     Platform=x64 时输出在 `bin\x64\Release\...\win-x64\publish`(递归搜 bin 目录找)。
   - 正确命令:
     ```
     msbuild Windows/MediaConverter/MediaConverter.csproj `
       /restore /t:Publish `
       /p:Configuration=Release /p:Platform=x64 `
       /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
       /p:EnableMsixTooling=true
     ```
3. **定位 publish 目录**: 用
   `Get-ChildItem -Path Windows/MediaConverter/bin -Recurse -Filter MediaConverter.exe |
   Where-Object { $_.FullName -match 'win-x64\\publish' } | Select-Object -First 1`
   找,别硬编码 TFV 版本号,也别只搜 `bin\Release`(Platform=x64 时路径带 x64)。
4. **捆绑 ffmpeg/ffprobe**: 从 gyan.dev 官方下载解压
   `https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip`,
   把 `bin/ffmpeg.exe` + `bin/ffprobe.exe` 复制到发布目录 `bin/` 下
   (App 内置查找顺序: AppContext.BaseDirectory/bin/ffmpeg.exe 第一优先)
5. **Inno Setup 编译单文件安装器**(替代 zip):
   - 安装: `choco install innosetup -y --no-progress`(iscc 进 PATH)
   - 编译:
     ```
     iscc "/O$env:GITHUB_WORKSPACE" "/DMyAppVersion=$ver" "/DPublishDir=$pubDir" Windows/Scripts/installer.iss
     ```
     `$ver = $tag.TrimStart('v')`(tag 是 v1.0.0,版本号要 1.0.0)。
   - **⚠️ iscc 默认把 exe 输出到 .iss 文件所在目录**(Windows/Scripts/),而上传
     步骤在仓库根目录找文件 → **必须 `/O$env:GITHUB_WORKSPACE` 指定输出目录**,
     否则 `files: MediaConverter-Windows-v*.exe` 匹配不到、上传静默失败。
6. 上传: `softprops/action-gh-release@v2` 需要
   `permissions: contents: write`;`files: MediaConverter-Windows-v*.exe`;
   `fail_on_unmatched_files: false` 避免 tag 输入为空时失败。
7. 触发后轮询:`gh run view <id> --json status,conclusion`,
   `gh run view <id> --log | grep -E "Error|error CS|WMC|not recognized"` 查失败原因。
   **pull 完整日志再判断**,别只看监控脚本抓到的模糊 "exit code 1"。

## 完整模板(2026-08-11 实测跑通: 构建 3m50s,exe 114MB 上传成功)

```yaml
name: Build Windows EXE

on:
  workflow_dispatch:        # 手动触发
    inputs:
      tag:
        description: 'Git tag to attach the build to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    branches: [main]
    paths: ['Windows/**', '.github/workflows/windows-build.yml']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # 允许上传 Release 资产

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.8'

      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          # 必须用 VS 的 msbuild.exe(dotnet publish/dotnet msbuild 缺 XAML
          # MarkupCompilePass2 LocalAssembly 传递 → WMC1509)。Platform=x64 必传。
          msbuild Windows/MediaConverter/MediaConverter.csproj `
            /restore /t:Publish `
            /p:Configuration=Release /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
            /p:EnableMsixTooling=true

      - name: Locate publish output
        id: pub
        shell: pwsh
        run: |
          # Platform=x64 时输出在 bin\x64\Release\...\win-x64\publish,
          # 递归搜整个 bin 目录(不限定 bin\Release)。
          $pub = Get-ChildItem -Path Windows/MediaConverter/bin -Recurse `
            -Filter MediaConverter.exe | Where-Object { $_.FullName -match 'win-x64\\publish' } | Select-Object -First 1
          if (-not $pub) { throw "MediaConverter.exe not found in publish output" }
          $dir = $pub.DirectoryName
          Write-Output "publish_dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Output "exe_path=$($pub.FullName)" >> $env:GITHUB_OUTPUT

      - name: Bundle ffmpeg/ffprobe
        shell: pwsh
        run: |
          $pubDir = "${{ steps.pub.outputs.publish_dir }}"
          # 下载 gyan.dev 官方 ffmpeg essentials(静态构建)
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "$env:TEMP\ffmpeg.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\ffmpeg.zip" -DestinationPath "$env:TEMP\ffmpeg" -Force
          $ffbin = Get-ChildItem -Path "$env:TEMP\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffbin) { throw "ffmpeg.exe not found in downloaded archive" }
          New-Item -ItemType Directory -Force -Path "$pubDir\bin" | Out-Null
          Copy-Item "$($ffbin.DirectoryName)\ffmpeg.exe"  "$pubDir\bin\ffmpeg.exe"  -Force
          Copy-Item "$($ffbin.DirectoryName)\ffprobe.exe" "$pubDir\bin\ffprobe.exe" -Force
          Write-Host "bundled ffmpeg/ffprobe into $pubDir\bin"

      - name: Build installer EXE (Inno Setup)
        shell: pwsh
        run: |
          # 单 exe 安装器: WinUI 3 不支持 .NET 单文件发布, 必须把所有
          # 运行时 dll + bin/ffmpeg.exe/ffprobe.exe 打进安装器, 用户下载
          # 一个 exe 双击安装即可(体验等同 dmg 拖拽安装)。
          $tag = "${{ github.event.inputs.tag || 'v1.0.0' }}"
          $ver = $tag.TrimStart('v')
          $pubDir = "${{ steps.pub.outputs.publish_dir }}"
          # 安装 Inno Setup(官方 chocolatey 包, iscc 进 PATH)
          choco install innosetup -y --no-progress | Out-Null
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { throw "iscc not found after choco install" }
          # /O 必须指向 GITHUB_WORKSPACE, 否则 exe 生成在 .iss 所在目录, 上传找不到
          iscc "/O$env:GITHUB_WORKSPACE" "/DMyAppVersion=$ver" "/DPublishDir=$pubDir" Windows/Scripts/installer.iss
          Get-Item "MediaConverter-Windows-v$ver.exe" | Select-Object Name, Length

      - name: Smoke test (ffmpeg version)
        shell: pwsh
        run: |
          $pubDir = "${{ steps.pub.outputs.publish_dir }}"
          & "$pubDir\bin\ffmpeg.exe" -version | Select-Object -First 1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v1.0.0' }}
          files: MediaConverter-Windows-v*.exe
          fail_on_unmatched_files: false
```

## 验证

- workflow 静态验证: 结构(name/jobs/runs-on/steps)+ publish 命令完整 +
  权限字段 + csproj 模式匹配;缩进必须偶数(手写 YAML 常见错)。
- **iscc 输出一致性**: installer.iss 的 `OutputBaseFilename` 必须与上传 glob
  (`MediaConverter-Windows-v*.exe`)匹配,否则上传静默失败。
- 真实验证靠 GitHub Actions 日志与 Release 资产列表(`gh release view <tag>
  --json assets`),云构建结果回传后核对;再 `curl -r 0-1` 下载资产验证 HTTP 206
  + 文件头(MZ = Windows PE,PK = zip)。
- 注意 grep 跨行续行坑: workflow 里反引号续行的多行命令,单行 grep 匹配不到;
  验证脚本要先把 "`\n" 折叠成空格再搜。
- 首次云构建失败是**预期**的: 包引用 → XAML 语法 → 编译链 → msbuild 可用性,
  按 SKILL.md "首次真实编译的坑" ①②③④ 逐层排查,每轮 pull 完整日志。
